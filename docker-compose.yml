services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kurgu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kurgu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-kurgu_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
