server:
  port: 8080

spring:
  application:
    name: core-api

  # 1. PostgreSQL + pgvector Bağlantısı
  datasource:
    url: jdbc:postgresql://localhost:5432/kurgu_db
    username: kurgu_admin
    password: admin_password_123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # Geliştirme aşamasında SQL sorgularını terminalde görmek için
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 2. Asenkron Mesajlaşma (Kafka) Bağlantısı
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: story-platform-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.Map
        spring.json.use.type.headers: false